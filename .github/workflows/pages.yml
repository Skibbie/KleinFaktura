name: Webseite

# Veröffentlicht den Ordner site/ als GitHub Pages (kleinfaktura.de). Bricht ab, solange Impressum oder
# Datenschutzerklärung noch Platzhalter enthalten. Alle Actions sind auf einen Commit festgelegt (Version im Kommentar).
on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rechtstexte prüfen
        run: |
          if grep -n 'class="todo"' site/*.html; then
            echo "::error::Impressum/Datenschutz enthalten noch Platzhalter"; exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
