name: Webseite

# Veröffentlicht den Ordner site/ als GitHub Pages (kleinfaktura.de). Bricht ab, solange Impressum oder
# Datenschutzerklärung noch Platzhalter enthalten.
on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Rechtstexte prüfen
        run: |
          if grep -n 'class="todo"' site/*.html; then
            echo "::error::Impressum/Datenschutz enthalten noch Platzhalter"; exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
