name: Release

# Zwei getrennte Jobs:
# - build: testet und baut Setup + ZIP. Hat weder Schreibrechte noch den Signaturschlüssel und installiert nur die
#   festgeschriebenen Abhängigkeiten mit Prüfsummen (requirements-build.txt).
# - sign-release: bekommt nur die fertigen Dateien, signiert sie und legt das Release an. Hier läuft kein Build und
#   kein Test, installiert wird allein cryptography (requirements-sign.txt, mit Prüfsummen).
# Alle Actions sind auf einen Commit festgelegt (Versionsnummer im Kommentar).
# Probelauf ohne Veröffentlichung: Actions → Release → „Run workflow“ (baut nur, signiert und veröffentlicht nicht).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Version prüfen
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $app = (Select-String -Path app/config.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME.TrimStart("v")
            if ($tag -ne $app) { throw "Tag v$tag passt nicht zu APP_VERSION $app in app/config.py" }
          }
          if ($app -notmatch '^\d+\.\d+\.\d+$') { throw "Unerwartete Versionsnummer: $app" }
          "VERSION=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Abhängigkeiten (festgeschrieben, mit Prüfsummen)
        run: python -m pip install --require-hashes --only-binary :all: -r requirements-build.txt

      - name: Tests
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Startbild erzeugen
        run: python tools/make_splash.py

      - name: Exe bauen
        run: >
          python -m PyInstaller --noconfirm --windowed --name KleinFaktura --icon assets\icon.ico --splash build\splash.png
          --add-data "assets;assets" --add-data "app\db\schema.sql;app\db" --add-data "docs;docs"
          --collect-data facturx --collect-data iso4217 --collect-data stdnum main.py

      - name: Installer bauen
        # Inno Setup 6 ist auf dem Windows-Runner vorinstalliert (kein Nachladen aus Chocolatey)
        run: |
          Copy-Item CHANGELOG.md, LICENSE, README.md dist/KleinFaktura/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 fehlt auf dem Runner: $iscc" }
          & $iscc /Qp "/DAppVersion=$env:VERSION" installer\KleinFaktura.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }

      - name: ZIP und Release-Text
        run: |
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist/KleinFaktura -DestinationPath "release/KleinFaktura-$env:VERSION.zip"
          Move-Item "dist/KleinFaktura-Setup-$env:VERSION.exe" release/
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]").LineNumber
          if (-not $start) { throw "Kein Abschnitt ## [$env:VERSION] in CHANGELOG.md" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Out-File release/notes.md -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  sign-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release

      - name: Abhängigkeiten (nur cryptography, mit Prüfsummen)
        run: python -m pip install --require-hashes --only-binary :all: -r requirements-sign.txt

      - name: Signieren
        # Ohne das Secret bricht das Release hier ab; installierte Programme lehnen unsignierte Updates ab.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        working-directory: release
        run: |
          python ../tools/sign_release.py "KleinFaktura-Setup-$env:VERSION.exe" "KleinFaktura-$env:VERSION.zip"
          if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen" }

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        working-directory: release
        run: >
          gh release create "$env:REF_NAME" "KleinFaktura-Setup-$env:VERSION.exe" "KleinFaktura-$env:VERSION.zip"
          SHA256SUMS.txt SHA256SUMS.txt.sig --repo "$env:GITHUB_REPOSITORY"
          --title "KleinFaktura $env:VERSION" --notes-file notes.md
